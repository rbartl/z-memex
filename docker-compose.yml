services:
  postgres:
    image: pgvector/pgvector:pg16 # official pgvector image — has the extension built in
    environment:
      POSTGRES_USER: memex
      POSTGRES_PASSWORD: memex
      POSTGRES_DB: memex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # expose locally for psql / debugging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memex"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  memex:
    build: .
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_URL: postgres://memex:memex@postgres:5432/memex?sslmode=disable
      OLLAMA_URL: http://host.docker.internal:11434
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env or environment}
      UI_USER: ${UI_USER:-admin}
      UI_PASS: ${UI_PASS:-password}
      EXTRACTOR: ${EXTRACTOR:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-}
      OLLAMA_EXTRACT_MODEL: ${OLLAMA_EXTRACT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      EXTRACTION_WORKERS: ${EXTRACTION_WORKERS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
