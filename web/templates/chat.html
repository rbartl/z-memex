{{ define "content" }}
<style>
    .chat-layout {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 56px - 4rem);
        min-height: 400px;
    }

    .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
        flex-shrink: 0;
    }

    .chat-model-badge {
        font-size: 0.75rem;
        color: var(--text-dim);
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.2rem 0.6rem;
        font-family: monospace;
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        padding-right: 0.25rem;
        margin-bottom: 1rem;
    }

    .chat-messages::-webkit-scrollbar {
        width: 4px;
    }
    .chat-messages::-webkit-scrollbar-track {
        background: transparent;
    }
    .chat-messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
    }

    .chat-bubble {
        padding: 0.65rem 0.9rem;
        border-radius: 10px;
        font-size: 0.9rem;
        line-height: 1.6;
        word-break: break-word;
        max-width: 80%;
    }

    .chat-bubble-user {
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 2px;
        white-space: pre-wrap; /* preserve newlines in plain user text */
    }

    .chat-bubble-assistant {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-bottom-left-radius: 2px;
        /* no pre-wrap: markdown renderer handles whitespace */
    }

    .chat-bubble-wrapper {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
    }

    .chat-bubble-wrapper-user {
        align-items: flex-end;
    }

    .chat-bubble-wrapper-assistant {
        align-items: flex-start;
    }

    /* Blinking cursor shown while streaming */
    .chat-cursor {
        display: inline-block;
        width: 2px;
        height: 0.9em;
        background: var(--accent);
        margin-left: 1px;
        vertical-align: text-bottom;
        animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    /* Thinking indicator — compact pill, not a full-width box */
    .chat-thinking {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 0.85rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        color: var(--text-dim);
        font-size: 0.85rem;
        font-style: italic;
    }

    .chat-thinking-dots span {
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--text-dim);
        animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .chat-thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .chat-thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40%            { transform: translateY(-4px); opacity: 1; }
    }

    /* Sources */
    .chat-sources {
        font-size: 0.78rem;
        max-width: 80%;
    }

    .chat-sources summary {
        cursor: pointer;
        color: var(--text-dim);
        user-select: none;
        padding: 0.15rem 0;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 0.3rem;
    }

    .chat-sources summary::before {
        content: '▸';
        font-size: 0.7rem;
        transition: transform 0.15s;
    }

    .chat-sources[open] summary::before {
        transform: rotate(90deg);
    }

    .chat-sources summary:hover {
        color: var(--text);
    }

    .chat-source-item {
        margin-top: 0.4rem;
        padding: 0.5rem 0.7rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 0.3rem;
    }

    .chat-source-meta {
        color: var(--text-dim);
        font-size: 0.72rem;
        margin-bottom: 0.2rem;
        display: flex;
        gap: 0.5rem;
    }

    .chat-source-content {
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 72px;
        overflow: hidden;
        mask-image: linear-gradient(to bottom, black 55%, transparent 100%);
    }

    /* Input area */
    .chat-input-area {
        flex-shrink: 0;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        align-items: flex-end;
        gap: 0;
        transition: border-color 0.2s;
    }

    .chat-input-area:focus-within {
        border-color: var(--accent);
    }

    .chat-input {
        flex: 1;
        padding: 0.75rem 1rem;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
        resize: none;
        font-family: inherit;
        line-height: 1.5;
        max-height: 160px;
        overflow-y: auto;
    }

    .chat-input::placeholder {
        color: var(--text-dim);
    }

    .chat-send {
        margin: 0.4rem;
        padding: 0.5rem 1rem;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background 0.2s, opacity 0.2s;
        flex-shrink: 0;
        align-self: flex-end;
    }

    .chat-send:hover:not(:disabled) {
        background: var(--accent-hover);
    }

    .chat-send:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .chat-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        gap: 0.5rem;
        font-size: 0.95rem;
    }

    .chat-empty-icon {
        font-size: 2.5rem;
        margin-bottom: 0.25rem;
    }

    /* Thinking block — shown above the response bubble when the model reasons */
    .chat-thinking-block {
        max-width: 80%;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        font-size: 0.8rem;
        transition: border-color 0.3s;
    }

    .chat-thinking-block.is-streaming {
        border-color: var(--accent);
        animation: thinking-pulse 2s ease-in-out infinite;
    }

    @keyframes thinking-pulse {
        0%, 100% { border-color: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 30%, transparent); }
        50%       { border-color: var(--accent-hover); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent); }
    }

    .chat-thinking-block summary {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
        user-select: none;
        color: var(--text-dim);
        background: var(--bg-card);
        list-style: none;
    }

    .chat-thinking-block summary::before {
        content: '▸';
        font-size: 0.65rem;
        transition: transform 0.15s;
        flex-shrink: 0;
    }

    .chat-thinking-block[open] summary::before {
        transform: rotate(90deg);
    }

    .chat-thinking-block summary:hover { color: var(--text); }

    .chat-thinking-block.is-streaming summary {
        color: var(--accent);
    }

    .chat-thinking-content {
        padding: 0.6rem 0.75rem;
        background: var(--bg);
        color: var(--text-dim);
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 240px;
        overflow-y: auto;
        border-top: 1px solid var(--border);
    }

    /* Markdown rendering inside assistant bubbles */
    .chat-bubble-assistant p { margin: 0 0 0.6rem; }
    .chat-bubble-assistant p:last-child { margin-bottom: 0; }
    .chat-bubble-assistant h1,
    .chat-bubble-assistant h2,
    .chat-bubble-assistant h3,
    .chat-bubble-assistant h4 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0.75rem 0 0.35rem;
        color: var(--text);
    }
    .chat-bubble-assistant h1:first-child,
    .chat-bubble-assistant h2:first-child,
    .chat-bubble-assistant h3:first-child { margin-top: 0; }
    .chat-bubble-assistant ul,
    .chat-bubble-assistant ol {
        padding-left: 1.4rem;
        margin: 0.4rem 0;
    }
    .chat-bubble-assistant li { margin-bottom: 0.2rem; }
    .chat-bubble-assistant code {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0.1em 0.35em;
        font-family: ui-monospace, monospace;
        font-size: 0.85em;
    }
    .chat-bubble-assistant pre {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.75rem 1rem;
        overflow-x: auto;
        margin: 0.5rem 0;
    }
    .chat-bubble-assistant pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: 0.85em;
    }
    .chat-bubble-assistant blockquote {
        border-left: 3px solid var(--accent);
        margin: 0.5rem 0;
        padding: 0.25rem 0.75rem;
        color: var(--text-dim);
    }
    .chat-bubble-assistant a {
        color: var(--accent);
        text-decoration: underline;
    }
    .chat-bubble-assistant hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 0.75rem 0;
    }
    .chat-bubble-assistant strong { font-weight: 600; }
    .chat-bubble-assistant em { font-style: italic; }
</style>

<div class="chat-layout" x-data="chatApp()">
    <div class="chat-header">
        <h1>Chat</h1>
        <span class="chat-model-badge" x-text="'model: ' + model"></span>
    </div>

    <!-- Messages area -->
    <div class="chat-messages" x-ref="messages">
        <!-- Empty state -->
        <template x-if="messages.length === 0">
            <div class="chat-empty">
                <div class="chat-empty-icon">💬</div>
                <div>Ask anything about your knowledge base</div>
                <div style="font-size:0.8rem">Relevant memories will be retrieved and shown as sources</div>
            </div>
        </template>

        <!-- Message bubbles -->
        <template x-for="(msg, idx) in messages" :key="idx">
            <div :class="'chat-bubble-wrapper chat-bubble-wrapper-' + msg.role">
                <!-- User bubble -->
                <template x-if="msg.role === 'user'">
                    <div class="chat-bubble chat-bubble-user" x-text="msg.content"></div>
                </template>

                <!-- Assistant bubble -->
                <template x-if="msg.role === 'assistant'">
                    <!-- Waiting pill: shown only before any content OR thinking arrives -->
                    <div class="chat-thinking" x-show="msg.streaming && msg.content === '' && msg.thinking === ''">
                        <span>Thinking</span>
                        <span class="chat-thinking-dots">
                            <span></span><span></span><span></span>
                        </span>
                    </div>
                </template>
                <template x-if="msg.role === 'assistant' && msg.thinking !== ''">
                    <!-- Real thinking block: streamed reasoning content from the model -->
                    <details
                        class="chat-thinking-block"
                        :class="{ 'is-streaming': msg.streaming && msg.content === '' }"
                        :open="msg.streaming"
                    >
                        <summary>
                            <span x-text="msg.streaming && msg.content === '' ? 'Thinking…' : 'Reasoning'"></span>
                        </summary>
                        <div
                            class="chat-thinking-content"
                            x-text="msg.thinking"
                            x-effect="if (msg.streaming) { $el.scrollTop = $el.scrollHeight }"
                        ></div>
                    </details>
                </template>
                <template x-if="msg.role === 'assistant' && msg.content !== ''">
                    <!-- Response bubble — appears once first token arrives -->
                    <div class="chat-bubble chat-bubble-assistant">
                        <span x-html="renderMarkdown(msg.content)"></span><span class="chat-cursor" x-show="msg.streaming"></span>
                    </div>
                </template>
                <template x-if="msg.role === 'assistant' && msg.sources && msg.sources.length > 0">
                    <!-- Sources -->
                    <details class="chat-sources">
                        <summary x-text="msg.sources.length + ' source' + (msg.sources.length === 1 ? '' : 's') + ' used'"></summary>
                        <template x-for="(src, si) in msg.sources" :key="si">
                            <div class="chat-source-item">
                                <div class="chat-source-meta">
                                    <span x-text="src.source || 'unknown'"></span>
                                    <span x-text="'score: ' + src.score.toFixed(3)"></span>
                                </div>
                                <div class="chat-source-content" x-text="src.content"></div>
                            </div>
                        </template>
                    </details>
                </template>
            </div>
        </template>
    </div>

    <!-- Input area -->
    <div class="chat-input-area">
        <textarea
            class="chat-input"
            x-model="input"
            placeholder="Ask about your knowledge base… (Enter to send, Shift+Enter for newline)"
            rows="1"
            :disabled="streaming"
            @keydown.enter.prevent="if (!$event.shiftKey && !streaming) send()"
            @input="$el.style.height='auto'; $el.style.height=$el.scrollHeight+'px'"
        ></textarea>
        <button class="chat-send" :disabled="streaming || input.trim() === ''" @click="send()">Send</button>
    </div>
</div>

<script>
// Configure marked once — disable mangling of email links, use safe defaults.
marked.use({
    gfm: true,        // GitHub Flavored Markdown (tables, strikethrough, etc.)
    breaks: true,     // single newlines become <br> (chat-friendly)
});

function renderMarkdown(text) {
    return marked.parse(text || '');
}

function chatApp() {
    return {
        model: {{ .Model | toJSON }},
        messages: [],
        input: '',
        streaming: false,
        allSources: [],   // deduplicated pool of every memory retrieved so far

        historyForServer() {
            // Send only completed (non-streaming) turns, stripped of UI-only fields.
            return this.messages
                .filter(m => !m.streaming)
                .map(m => ({ role: m.role, content: m.content }));
        },

        accumulateSources(newSources) {
            const seen = new Set(this.allSources.map(s => s.id));
            for (const s of newSources) {
                if (!seen.has(s.id)) {
                    seen.add(s.id);
                    this.allSources.push(s);
                }
            }
        },

        scrollToBottom() {
            this.$nextTick(() => {
                const el = this.$refs.messages;
                if (el) el.scrollTop = el.scrollHeight;
            });
        },

        async send() {
            const text = this.input.trim();
            if (!text || this.streaming) return;

            this.input = '';
            this.messages.push({ role: 'user', content: text });
            this.messages.push({ role: 'assistant', content: '', thinking: '', sources: [], streaming: true });
            this.streaming = true;
            this.scrollToBottom();

            // Always reference through this.messages[idx] so Alpine's Proxy
            // detects the mutations and updates the DOM.
            const idx = this.messages.length - 1;
            const history = this.historyForServer().slice(0, -1); // exclude user msg just added

            try {
                const response = await fetch('/ui/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history, prior_sources: this.allSources })
                });

                if (!response.ok) {
                    this.messages[idx].content = 'Error: request failed (' + response.status + ')';
                    this.messages[idx].streaming = false;
                    this.streaming = false;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';
                let currentEvent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buf += decoder.decode(value, { stream: true });
                    const lines = buf.split('\n');
                    buf = lines.pop(); // keep incomplete line

                    for (const line of lines) {
                        if (line.startsWith('event: ')) {
                            currentEvent = line.slice(7).trim();
                        } else if (line.startsWith('data: ')) {
                            const raw = line.slice(6);
                            try {
                                const parsed = JSON.parse(raw);
                                if (currentEvent === 'thinking') {
                                    this.messages[idx].thinking += parsed;
                                    this.scrollToBottom();
                                } else if (currentEvent === 'sources') {
                                    this.messages[idx].sources = parsed;
                                    this.accumulateSources(parsed);
                                } else if (currentEvent === 'token') {
                                    this.messages[idx].content += parsed;
                                    this.scrollToBottom();
                                } else if (currentEvent === 'error') {
                                    this.messages[idx].content += '\n[stream error]';
                                }
                            } catch (_) {
                                // ignore malformed chunks
                            }
                            currentEvent = '';
                        }
                    }
                }
            } catch (err) {
                this.messages[idx].content = 'Error: ' + err.message;
            }

            this.messages[idx].streaming = false;
            this.streaming = false;
            this.scrollToBottom();
        }
    };
}
</script>
{{ end }}
