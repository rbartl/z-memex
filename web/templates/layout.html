{{ define "layout" }}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ .Title }} - Memex</title>
        <script src="/ui/static/vendor/htmx.min.js"></script>
        <script defer src="/ui/static/vendor/alpine.min.js"></script>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #0f1117;
                --bg-card: #1a1d27;
                --bg-hover: #232633;
                --border: #2a2d3a;
                --text: #e1e4ed;
                --text-dim: #8b8fa3;
                --accent: #6c8aff;
                --accent-hover: #8ba3ff;
                --danger: #ff6b6b;
                --tag-bg: #2a2d3a;
                --tag-text: #a8b0c5;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.6;
            }

            nav {
                background: var(--bg-card);
                border-bottom: 1px solid var(--border);
                padding: 0 2rem;
                display: flex;
                align-items: center;
                gap: 2rem;
                height: 56px;
            }

            nav .logo {
                font-weight: 700;
                font-size: 1.1rem;
                color: var(--accent);
                text-decoration: none;
            }

            nav a {
                color: var(--text-dim);
                text-decoration: none;
                font-size: 0.9rem;
                padding: 0.5rem 0;
                border-bottom: 2px solid transparent;
                transition:
                    color 0.2s,
                    border-color 0.2s;
            }

            nav a:hover,
            nav a.active {
                color: var(--text);
                border-bottom-color: var(--accent);
            }

            main {
                max-width: 1200px;
                margin: 0 auto;
                padding: 2rem;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .search-bar {
                width: 100%;
                padding: 0.75rem 1rem;
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--text);
                font-size: 0.95rem;
                margin-bottom: 1.5rem;
                outline: none;
                transition: border-color 0.2s;
            }

            .search-bar:focus {
                border-color: var(--accent);
            }

            .search-bar::placeholder {
                color: var(--text-dim);
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            thead th {
                text-align: left;
                padding: 0.75rem 1rem;
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-dim);
                border-bottom: 1px solid var(--border);
            }

            tbody tr {
                border-bottom: 1px solid var(--border);
                cursor: pointer;
                transition: background 0.15s;
            }

            tbody tr:hover {
                background: var(--bg-hover);
            }

            tbody td {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }

            .tag {
                display: inline-block;
                background: var(--tag-bg);
                color: var(--tag-text);
                padding: 0.15rem 0.5rem;
                border-radius: 4px;
                font-size: 0.75rem;
                margin-right: 0.25rem;
            }

            .card {
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .card h2 {
                font-size: 1.1rem;
                margin-bottom: 1rem;
            }

            .card .label {
                font-size: 0.8rem;
                color: var(--text-dim);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 0.25rem;
            }

            .card .value {
                margin-bottom: 1rem;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .btn {
                display: inline-block;
                padding: 0.5rem 1rem;
                border-radius: 6px;
                border: none;
                font-size: 0.85rem;
                cursor: pointer;
                text-decoration: none;
                transition: background 0.2s;
            }

            .btn-danger {
                background: var(--danger);
                color: white;
            }

            .btn-danger:hover {
                background: #ff5252;
            }

            .btn-secondary {
                background: var(--tag-bg);
                color: var(--text);
            }

            .btn-secondary:hover {
                background: var(--bg-hover);
            }

            .meta-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }

            .empty {
                text-align: center;
                padding: 3rem;
                color: var(--text-dim);
            }

            .importance-1 {
                background: var(--tag-bg);
                color: var(--text-dim);
            }
            .importance-2 {
                background: var(--tag-bg);
                color: var(--tag-text);
            }
            .importance-3 {
                background: #1e3a5f;
                color: #6cb4ee;
            }
            .importance-4 {
                background: #3d2e0a;
                color: #fbbf24;
            }
            .importance-5 {
                background: #3d0a0a;
                color: #ff6b6b;
            }
            .source-badge {
                display: inline-block;
                background: #1e3a5f;
                color: #6cb4ee;
                padding: 0.15rem 0.5rem;
                border-radius: 4px;
                font-size: 0.75rem;
            }

            .back-link {
                display: inline-block;
                color: var(--accent);
                text-decoration: none;
                margin-bottom: 1rem;
                font-size: 0.9rem;
            }

            .back-link:hover {
                color: var(--accent-hover);
            }

            #graph-container {
                position: relative;
                width: 100%;
                height: 600px;
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
            }

            #graph-container svg {
                width: 100%;
                height: 100%;
            }

            .node-label {
                font-size: 11px;
                fill: var(--text);
                pointer-events: none;
            }

            .edge-label {
                font-size: 9px;
                fill: var(--text-dim);
            }

            .htmx-indicator {
                display: none;
            }

            .htmx-request .htmx-indicator {
                display: inline;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="/ui" class="logo">memex</a>
            <a href="/ui">Memories</a>
            <a href="/ui/graph">Graph</a>
            <a href="/ui/setup">Setup</a>
        </nav>
        <main>{{ template "content" . }}</main>
    </body>
</html>
{{ end }}
