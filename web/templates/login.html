{{ define "login" }}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign in - Memex</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #0f1117;
                --bg-card: #1a1d27;
                --border: #2a2d3a;
                --text: #e1e4ed;
                --text-dim: #8b8fa3;
                --accent: #6c8aff;
                --accent-hover: #8ba3ff;
                --danger: #ff6b6b;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.6;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
            }

            .login-card {
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 2rem;
                width: 100%;
                max-width: 360px;
            }

            .logo {
                font-weight: 700;
                font-size: 1.25rem;
                color: var(--accent);
                margin-bottom: 0.25rem;
            }

            .subtitle {
                color: var(--text-dim);
                font-size: 0.9rem;
                margin-bottom: 1.5rem;
            }

            label {
                display: block;
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-dim);
                margin-bottom: 0.35rem;
            }

            input[type="text"],
            input[type="password"] {
                width: 100%;
                padding: 0.75rem 1rem;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text);
                font-size: 0.95rem;
                margin-bottom: 1rem;
                outline: none;
                transition: border-color 0.2s;
            }

            input[type="text"]:focus,
            input[type="password"]:focus {
                border-color: var(--accent);
            }

            button {
                width: 100%;
                padding: 0.65rem 1rem;
                border: none;
                border-radius: 6px;
                background: var(--accent);
                color: #0f1117;
                font-size: 0.9rem;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s;
            }

            button:hover {
                background: var(--accent-hover);
            }

            .error {
                background: #3d0a0a;
                color: var(--danger);
                border-radius: 6px;
                padding: 0.6rem 0.85rem;
                font-size: 0.85rem;
                margin-bottom: 1rem;
            }
        </style>
    </head>
    <body>
        <div class="login-card">
            <div class="logo">memex</div>
            <div class="subtitle">Sign in to continue</div>

            {{ if .Error }}
                <div class="error" role="alert">{{ .Error }}</div>
            {{ end }}

            <form method="post" action="/ui/login">
                <input type="hidden" name="next" value="{{ .Next }}" />

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ .Username }}"
                    autocomplete="username"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    required
                    autofocus
                />

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                />

                <button type="submit">Sign in</button>
            </form>
        </div>
    </body>
</html>
{{ end }}
